name: CI

on:
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!**/README'
      - '!**/README.*'
      - 'docs/IMPLEMENTATION_PLAN.md'
      - 'docs/IMPLEMENTATION_PROGRESS.md'
      - 'docs/IMPLEMENTATION_PROMPT_DEPENDENCIES.md'
  push:
    branches-ignore: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!**/README'
      - '!**/README.*'
      - 'docs/IMPLEMENTATION_PLAN.md'
      - 'docs/IMPLEMENTATION_PROGRESS.md'
      - 'docs/IMPLEMENTATION_PROMPT_DEPENDENCIES.md'
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to verify.
        required: true
        type: string
      exact_head_commit:
        description: Validate only the exact ref commit for a trusted reusable-workflow caller.
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Attach exact-SHA verification branch
        run: git switch --create "ci-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Validate implementation work registration
        id: work_registration
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EXACT_HEAD_COMMIT: ${{ inputs.exact_head_commit || false }}
        run: |
          head_sha=$(git rev-parse HEAD)
          if [ "$EXACT_HEAD_COMMIT" = "true" ]; then
            if base_sha=$(git rev-parse --verify "$head_sha^" 2>/dev/null); then
              npm run validate:work-registration -- --range "$base_sha..$head_sha"
              changed_paths=$(git diff --name-only "$base_sha" "$head_sha")
            else
              npm run validate:work-registration -- --commit "$head_sha"
              changed_paths=$(git diff-tree --root --no-commit-id --name-only -r "$head_sha")
            fi
          else
            base_sha="$PR_BASE_SHA"
            if [ -z "$base_sha" ]; then
              base_sha="$PUSH_BEFORE_SHA"
            fi
            if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
              if ! base_sha=$(git merge-base origin/main "$head_sha" 2>/dev/null); then
                echo "Unable to derive a trusted implementation-registration base from origin/main." >&2
                exit 1
              fi
            fi
            if [ "$base_sha" = "$head_sha" ]; then
              echo "Unable to derive a trusted implementation-registration base before the exact head." >&2
              exit 1
            fi
            npm run validate:work-registration -- --range "$base_sha..$head_sha"
            changed_paths=$(git diff --name-only "$base_sha" "$head_sha")
          fi
          documentation_only=true
          while IFS= read -r changed_path; do
            case "$changed_path" in
              *.md|README|*/README|README.*|*/README.*) ;;
              *) documentation_only=false ;;
            esac
          done <<EOF
          $changed_paths
          EOF
          if [ "$documentation_only" = true ]; then
            npm run coordination:docs
          fi
          echo "documentation_only=$documentation_only" >> "$GITHUB_OUTPUT"

      - name: Validate dependency authority and dispatcher drift
        run: npm run validate:dependencies

      - uses: actions/setup-java@v5
        if: steps.work_registration.outputs.documentation_only != 'true'
        with:
          distribution: temurin
          java-version: 21

      - if: steps.work_registration.outputs.documentation_only != 'true'
        run: npm ci --prefer-offline --no-audit
      - if: steps.work_registration.outputs.documentation_only != 'true'
        run: npm ci --prefix functions --prefer-offline --no-audit

      - name: Lint
        if: steps.work_registration.outputs.documentation_only != 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.work_registration.outputs.documentation_only != 'true'
        run: npm test

      - name: Firestore security-rule tests
        if: steps.work_registration.outputs.documentation_only != 'true'
        run: npm run test:rules

      - name: Build web
        if: steps.work_registration.outputs.documentation_only != 'true'
        run: npm run build

      - name: Check web bundle size
        if: steps.work_registration.outputs.documentation_only != 'true'
        run: node scripts/check-bundle-size.mjs

      - name: Build functions
        if: steps.work_registration.outputs.documentation_only != 'true'
        run: npm run build --prefix functions

      - name: Upload web build artifact
        if: steps.work_registration.outputs.documentation_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload Functions build artifact
        if: steps.work_registration.outputs.documentation_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: functions-lib
          path: functions/lib
          if-no-files-found: error
          retention-days: 1
