name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/README'
      - '**/README.*'
  push:
    branches-ignore: [main]
    paths-ignore:
      - '**/*.md'
      - '**/README'
      - '**/README.*'
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to verify.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Attach exact-SHA verification branch
        run: git switch --create "ci-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci --prefer-offline --no-audit
      - run: npm ci --prefix functions --prefer-offline --no-audit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Firestore security-rule tests
        run: npm run test:rules

      - name: Build web
        run: npm run build

      - name: Check web bundle size
        run: node scripts/check-bundle-size.mjs

      - name: Build functions
        run: npm run build --prefix functions

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload Functions build artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-lib
          path: functions/lib
          if-no-files-found: error
          retention-days: 1
