name: CI

on:
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!**/README'
      - '!**/README.*'
      - 'docs/IMPLEMENTATION_PLAN.md'
      - 'docs/IMPLEMENTATION_PROGRESS.md'
      - 'docs/IMPLEMENTATION_PROMPT_DEPENDENCIES.md'
      - 'CLAUDE.md'
      - 'docs/WORKTREE_COORDINATION.md'
      - 'docs/AGENT_CAMPAIGN_PLAYBOOK.md'
  push:
    branches-ignore: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!**/README'
      - '!**/README.*'
      - 'docs/IMPLEMENTATION_PLAN.md'
      - 'docs/IMPLEMENTATION_PROGRESS.md'
      - 'docs/IMPLEMENTATION_PROMPT_DEPENDENCIES.md'
      - 'CLAUDE.md'
      - 'docs/WORKTREE_COORDINATION.md'
      - 'docs/AGENT_CAMPAIGN_PLAYBOOK.md'
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to verify.
        required: true
        type: string
      exact_head_commit:
        description: Validate only the exact ref commit for a trusted reusable-workflow caller.
        required: true
        type: boolean
      deployment_targets:
        description: Comma-separated Firebase surfaces selected by the deployment range.
        required: false
        default: ''
        type: string
      ticker_required:
        description: Run the browser ticker lifecycle gate for an affected release range.
        required: false
        default: false
        type: boolean
      font_required:
        description: Run the console-font consistency gate for an affected release range.
        required: false
        default: false
        type: boolean
      typography_required:
        description: Run rendered computed-style typography verification for the exact release commit.
        required: false
        default: false
        type: boolean
      render_required:
        description: Run the sustained-render benchmark for an affected release range.
        required: false
        default: false
        type: boolean
      unit_required:
        description: Run root unit tests for an affected release range.
        required: false
        default: false
        type: boolean
      web_build_required:
        description: Build web assets needed by an affected release-range check.
        required: false
        default: false
        type: boolean
      bundle_required:
        description: Check the web bundle for an affected release range.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Attach exact-SHA verification branch
        run: git switch --create "ci-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Identify changed paths
        id: change_scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EXACT_HEAD_COMMIT: ${{ inputs.exact_head_commit || false }}
          DEPLOYMENT_TARGETS: ${{ inputs.deployment_targets || '' }}
          TICKER_REQUIRED: ${{ inputs.ticker_required || false }}
          FONT_REQUIRED: ${{ inputs.font_required || false }}
          TYPOGRAPHY_REQUIRED: ${{ inputs.typography_required || false }}
          RENDER_REQUIRED: ${{ inputs.render_required || false }}
          UNIT_REQUIRED: ${{ inputs.unit_required || false }}
          WEB_BUILD_REQUIRED: ${{ inputs.web_build_required || false }}
          BUNDLE_REQUIRED: ${{ inputs.bundle_required || false }}
        run: |
          head_sha=$(git rev-parse HEAD)
          if [ "$EXACT_HEAD_COMMIT" = "true" ]; then
            has_hosting=false
            has_functions=false
            has_firestore=false
            [[ ",$DEPLOYMENT_TARGETS," == *,hosting,* ]] && has_hosting=true
            [[ ",$DEPLOYMENT_TARGETS," == *,functions,* ]] && has_functions=true
            [[ ",$DEPLOYMENT_TARGETS," == *,firestore,* ]] && has_firestore=true
            run_font=$FONT_REQUIRED
            run_typography=$TYPOGRAPHY_REQUIRED
            if [ "$has_hosting" = "true" ]; then
              run_font=true
              run_typography=true
            fi
            # A Hosting release always builds its deployable artifact. Other web
            # checks follow the classifier so server-only releases do not rerun
            # unrelated unit or bundle gates. Hosting cannot opt out of either
            # typography gate at the exact commit used for deployment.
            run_unit=$UNIT_REQUIRED
            run_web_build=$has_hosting
            run_bundle=$BUNDLE_REQUIRED
            [[ "$WEB_BUILD_REQUIRED" == "true" ]] && run_web_build=true
            echo "documentation_only=false" >> "$GITHUB_OUTPUT"
            echo "roadmap_changed=true" >> "$GITHUB_OUTPUT"
            echo "root_install=true" >> "$GITHUB_OUTPUT"
            echo "functions_install=$has_functions" >> "$GITHUB_OUTPUT"
            echo "lint=true" >> "$GITHUB_OUTPUT"
            echo "unit=$run_unit" >> "$GITHUB_OUTPUT"
            echo "functions=$has_functions" >> "$GITHUB_OUTPUT"
            echo "firestore=$has_firestore" >> "$GITHUB_OUTPUT"
            echo "web_build=$run_web_build" >> "$GITHUB_OUTPUT"
            echo "ticker=$TICKER_REQUIRED" >> "$GITHUB_OUTPUT"
            echo "font=$run_font" >> "$GITHUB_OUTPUT"
            echo "typography=$run_typography" >> "$GITHUB_OUTPUT"
            echo "render=$RENDER_REQUIRED" >> "$GITHUB_OUTPUT"
            echo "bundle=$run_bundle" >> "$GITHUB_OUTPUT"
          else
            changed_paths=$(node scripts/ci-changed-paths.mjs \
              --head "$head_sha" \
              --pr-base "$PR_BASE_SHA" \
              --push-before "$PUSH_BEFORE_SHA")
            changed_paths_file="$RUNNER_TEMP/ci-changed-paths.txt"
            printf '%s\n' "$changed_paths" > "$changed_paths_file"
            node scripts/risk-gates.mjs --files-file "$changed_paths_file" >> "$GITHUB_OUTPUT"
          fi
          echo "exact_head_commit=$EXACT_HEAD_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Install locked root dependencies for release contracts
        run: npm ci --prefer-offline --no-audit

      - name: Typography release-gate contract
        run: npm run test:typography:release-gate

      - name: Firebase deployment batching contract
        run: node --test scripts/deploy-firebase-surfaces.test.mjs

      - name: Check prompt catalog and generated views
        if: steps.change_scope.outputs.roadmap_changed == 'true'
        run: npm run roadmap:check

      - name: Validate documentation
        if: steps.change_scope.outputs.documentation_only == 'true' || steps.change_scope.outputs.exact_head_commit == 'true'
        run: npm run coordination:docs

      - name: Validate runtime threat model
        run: npm run security:threat-model

      - uses: actions/setup-java@v5
        if: steps.change_scope.outputs.firestore == 'true'
        with:
          distribution: temurin
          java-version: 21

      - if: steps.change_scope.outputs.functions_install == 'true' || steps.change_scope.outputs.web_build == 'true'
        run: npm ci --prefix functions --prefer-offline --no-audit

      - name: Lint
        if: steps.change_scope.outputs.lint == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.change_scope.outputs.unit == 'true'
        run: npm run test:unit

      - name: Functions tests
        if: steps.change_scope.outputs.functions == 'true'
        run: npm run test:functions

      - name: Firestore security-rule tests
        if: steps.change_scope.outputs.firestore == 'true'
        run: npm run test:rules

      - name: Build web
        if: steps.change_scope.outputs.web_build == 'true'
        run: npm run build

      - name: Console font consistency
        if: steps.change_scope.outputs.font == 'true'
        run: npm run test:font-consistency

      - name: Install rendered typography browser
        if: steps.change_scope.outputs.typography == 'true'
        run: npx playwright install --with-deps chromium

      - name: Computed-style typography gate
        if: steps.change_scope.outputs.typography == 'true'
        run: npm run test:typography:browser

      - name: Upload rendered typography evidence
        if: always() && steps.change_scope.outputs.typography == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: computed-style-typography
          path: /tmp/pc04-typography
          if-no-files-found: warn
          retention-days: 7

      - name: Install ticker smoke browser
        if: (steps.change_scope.outputs.ticker == 'true' || steps.change_scope.outputs.render == 'true') && steps.change_scope.outputs.typography != 'true' && steps.change_scope.outputs.exact_head_commit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Browser ticker smoke
        if: steps.change_scope.outputs.ticker == 'true' && steps.change_scope.outputs.exact_head_commit != 'true'
        run: npm run test:ticker:browser

      - name: Render-performance baselines
        if: steps.change_scope.outputs.render == 'true' && steps.change_scope.outputs.exact_head_commit != 'true'
        run: node scripts/prompt-637-render-performance.mjs

      - name: Upload render-performance evidence
        if: always() && steps.change_scope.outputs.render == 'true' && steps.change_scope.outputs.exact_head_commit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: render-performance-p637
          path: /tmp/p637-render-performance/results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload ticker smoke failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-ticker-smoke-failure
          path: /tmp/fleet-ticker-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Check web bundle size
        if: steps.change_scope.outputs.bundle == 'true'
        run: node scripts/check-bundle-size.mjs

      - name: Build functions
        if: steps.change_scope.outputs.functions == 'true'
        run: npm run build --prefix functions

      - name: Upload web build artifact
        if: steps.change_scope.outputs.web_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload Functions build artifact
        if: steps.change_scope.outputs.functions == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: functions-lib
          path: functions/lib
          if-no-files-found: error
          retention-days: 1

  exact-sha-browser-gates:
    if: ${{ inputs.exact_head_commit && inputs.ticker_required }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [press, turn-zero, lifecycle]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --prefer-offline --no-audit

      - name: Install ticker smoke browser
        run: npx playwright install --with-deps chromium

      - name: Browser ticker smoke
        env:
          TICKER_SMOKE_SHARD: ${{ matrix.shard }}
        run: npm run test:ticker:browser

      - name: Upload ticker smoke failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-ticker-smoke-failure-${{ matrix.shard }}
          path: /tmp/fleet-ticker-smoke
          if-no-files-found: ignore
          retention-days: 7

  exact-sha-render-gate:
    if: ${{ inputs.exact_head_commit && inputs.render_required }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - run: npm ci --prefer-offline --no-audit

      - name: Install Functions dependencies for shared types
        run: npm ci --prefix functions --prefer-offline --no-audit

      - name: Install render browser
        run: npx playwright install --with-deps chromium

      - name: Build web for render baseline
        run: npm run build

      - name: Render-performance baselines
        run: node scripts/prompt-637-render-performance.mjs

      - name: Upload render-performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-performance-p637
          path: /tmp/p637-render-performance/results.json
          if-no-files-found: warn
          retention-days: 7
