name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/README'
      - '**/README.*'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # id-token is what lets this job mint a short-lived Google credential via
    # Workload Identity Federation. No service-account key is stored anywhere.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix functions

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Firestore security-rule tests
        run: npm run test:rules

      - name: Build web
        run: npm run build

      - name: Build functions
        run: npm run build --prefix functions

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy hosting, Firestore rules and functions
        run: |
          npx --yes firebase-tools@15.29.0 deploy \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" \
            --only hosting,firestore,functions \
            --non-interactive
