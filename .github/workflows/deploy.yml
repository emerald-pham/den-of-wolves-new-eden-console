name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  queue: max
  # A canceled deployment can leave one surface behind the main commit. Queue
  # main releases so every target set is deployed in commit order.
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  determine-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
      current_tip: ${{ steps.targets.outputs.current_tip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read current main tip
        id: current-tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          current_tip="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test -n "$current_tip"
          echo "sha=$current_tip" >> "$GITHUB_OUTPUT"

      - name: Find last successful deployment baseline
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runs=""
          if ! runs=$(gh api \
            "repos/$REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | [.id, .head_sha] | @tsv'); then
            runs=""
          fi
          baseline=""
          while IFS=$'\t' read -r run_id head_sha; do
            [[ -n "$run_id" && -n "$head_sha" ]] || continue
            deploy_conclusion=""
            if ! deploy_conclusion=$(gh api \
              "repos/$REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "deploy") | .conclusion] | .[0] // ""'); then
              continue
            fi
            if [[ "$deploy_conclusion" == "success" ]]; then
              baseline="$head_sha"
              break
            fi
          done <<< "$runs"
          if [[ -z "$baseline" ]]; then
            echo 'No prior deployment job completed successfully; target detection will fail closed.'
          fi
          echo "base_sha=$baseline" >> "$GITHUB_OUTPUT"

      - name: Determine deployment targets
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASELINE_SHA: ${{ steps.baseline.outputs.base_sha }}
          COMMIT_SHA: ${{ github.sha }}
          CURRENT_MAIN_TIP: ${{ steps.current-tip.outputs.sha }}
        run: |
          node scripts/deployment-targets.mjs \
            --before "$BASELINE_SHA" \
            --after "$COMMIT_SHA" \
            --current-main-tip "$CURRENT_MAIN_TIP" \
            --manual "$([[ "$EVENT_NAME" == "workflow_dispatch" ]] && echo true || echo false)" \
            >> "$GITHUB_OUTPUT"

  verify:
    if: needs.determine-targets.outputs.has_targets == 'true' && needs.determine-targets.outputs.current_tip == 'true'
    needs: determine-targets
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
      exact_head_commit: true

  deploy:
    if: needs.determine-targets.outputs.has_targets == 'true' && needs.determine-targets.outputs.current_tip == 'true'
    needs: [determine-targets, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions runtime dependencies
        if: contains(needs.determine-targets.outputs.targets, 'functions')
        run: npm ci --prefix functions --omit=dev --prefer-offline --no-audit

      - name: Download web build artifact
        if: contains(needs.determine-targets.outputs.targets, 'hosting')
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist

      - name: Download Functions build artifact
        if: contains(needs.determine-targets.outputs.targets, 'functions')
        uses: actions/download-artifact@v8
        with:
          name: functions-lib
          path: functions/lib

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: contains(needs.determine-targets.outputs.targets, 'functions') || contains(needs.determine-targets.outputs.targets, 'firestore')
        uses: google-github-actions/setup-gcloud@v3

      - name: Confirm commit remains current main tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_tip="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_tip" = "$EXPECTED_SHA" || {
            echo "Refusing stale deployment: main is at $current_tip, expected $EXPECTED_SHA."
            exit 1
          }

      - name: Deploy affected Firebase surfaces
        env:
          CI_VERIFIED_ARTIFACTS: '1'
        run: |
          npx --yes firebase-tools@15.29.0 deploy \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" \
            --only "${{ needs.determine-targets.outputs.targets }}" \
            --non-interactive \
            --force

      # Firebase CLI creates callable services as public, but its update path
      # does not repair a missing callable invoker policy after a failed create.
      - name: Restore browser access to DRADIS contact trigger
        if: contains(needs.determine-targets.outputs.targets, 'functions')
        run: |
          service="$(gcloud functions describe triggerDradisContact \
            --v2 \
            --project="${{ vars.FIREBASE_PROJECT_ID }}" \
            --region="us-central1" \
            --format='value(serviceConfig.service)')"
          test -n "$service" || { echo 'Unable to resolve triggerDradisContact Cloud Run service.'; exit 1; }
          gcloud run services add-iam-policy-binding "$service" \
            --project="${{ vars.FIREBASE_PROJECT_ID }}" \
            --region="us-central1" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --quiet

      - name: Restore browser access to Turn 1 single-player demo
        if: contains(needs.determine-targets.outputs.targets, 'functions')
        run: |
          service="$(gcloud functions describe startSinglePlayerDemo \
            --v2 \
            --project="${{ vars.FIREBASE_PROJECT_ID }}" \
            --region="us-central1" \
            --format='value(serviceConfig.service)')"
          test -n "$service" || { echo 'Unable to resolve startSinglePlayerDemo Cloud Run service.'; exit 1; }
          gcloud run services add-iam-policy-binding "$service" \
            --project="${{ vars.FIREBASE_PROJECT_ID }}" \
            --region="us-central1" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --quiet

      - name: Verify deployed surfaces
        env:
          DEPLOY_TARGETS: ${{ needs.determine-targets.outputs.targets }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          node scripts/verify-deployment.mjs \
            --targets "$DEPLOY_TARGETS" \
            --project "$FIREBASE_PROJECT_ID" \
            --version "$(node -p "require('./package.json').version")"
