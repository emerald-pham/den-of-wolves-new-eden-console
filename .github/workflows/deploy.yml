name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix functions

      - name: Unit tests
        run: npm test

      - name: Firestore security-rule tests
        run: npx --yes firebase-tools@latest emulators:exec --only firestore "npx vitest run --project rules"

      - name: Build
        run: npm run build

      - name: Deploy hosting, Firestore rules and functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@latest deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only hosting,firestore,functions \
            --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
